## Step-by-Step Deployment

### **Step 1: Create Render Account (2 mins)**

1. Go to https://render.com
2. Click "Get Started"
3. Sign up with GitHub (recommended) or email
4. **No credit card required!**
5. Verify email if needed

---

### **Step 2: Prepare Your Code (5 mins)**

Your backend is almost ready. Just need to add one file:

**Create `/app/backend/render.yaml`:**

```yaml
services:
  - type: web
    name: bond-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: CORS_ORIGINS
        value: exp://,*.expo.dev,capacitor://,http://localhost:*
      - key: PYTHON_VERSION
        value: 3.11.0
```

